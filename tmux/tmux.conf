# Prefix: C-space (matches your current setup)
unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix

# Mouse
set -g mouse on

# 256-color + true color + OSC 52 clipboard passthrough
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g set-clipboard on
set -g allow-passthrough on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi mode in copy
setw -g mode-keys vi

# Vi-style splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi-style resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick reload
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Status bar: minimal
set -g status-position bottom
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=green][#S] "
set -g status-right "#[fg=yellow]%H:%M #[fg=cyan]%d-%b"
set -g status-left-length 20
set -g status-right-length 30

# Window status
setw -g window-status-current-style "fg=black,bg=green,bold"
setw -g window-status-style "fg=white,bg=default"

# Pane borders
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"

# History
set -g history-limit 50000

# Escape time (for neovim)
set -sg escape-time 10

# Focus events (for neovim autoread)
set -g focus-events on

# Copy mode: vi-style
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux load-buffer -w -"
